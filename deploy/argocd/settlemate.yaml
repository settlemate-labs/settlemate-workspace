apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: settlemate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/settlemate-labs/settlemate-workspace.git
    targetRevision: develop
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: settlemate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
