services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: settlemate
      MYSQL_USER: settlemate
      MYSQL_PASSWORD: settlemate
      MYSQL_ROOT_PASSWORD: settlemate
    ports:
      - "33062:3306"
  redis:
    image: redis:7
    ports:
      - "63792:6379"
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "56722:5672"
      - "15672:15672"
